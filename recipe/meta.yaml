{% set name = "minizip" %}
{% set version = "4.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/zlib-ng/minizip-ng/archive/{{ version }}/{{ name }}-{{ version }}.tar.gz
  sha256: 3cc35c2cb925dbe67cc801e3234b31b0f30197812a99377352fa1b551ab3d011

build:
  number: 0
  run_exports:
    - {{ pin_subpackage('minizip', max_pin='x') }}
  ignore_run_exports:
    - gtest

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}  # [not win]
    - cmake
    # PPMd: CMake FetchContent git-clones ip7z/7zip — not satisfied by the 7zip archiver conda package
    - git
    - make  # [not win]
    - ninja-base  # [win]
    - pkg-config
  host:
    - bzip2 {{ bzip2 }}
    - libiconv {{ libiconv }}  # [not win]
    - openssl {{ openssl }}  # [not win]
    - xz {{ xz }}
    - zlib {{ zlib }}
    - zstd {{ zstd }}
    - gtest {{ gtest }}

test:
  commands:
    # presence of shared libraries
    - test -f $PREFIX/lib/libminizip${SHLIB_EXT}  # [unix]
    - if not exist %LIBRARY_BIN%\libminizip.dll exit 1  # [win]
    - if not exist %LIBRARY_LIB%\libminizip.lib exit 1  # [win]
    # absence of static libraries
    - test ! -f $PREFIX/lib/libminizip.a  # [unix]

about:
  home: https://github.com/zlib-ng/minizip-ng
  license: Zlib
  license_family: Other
  license_file: LICENSE
  summary: minizip-ng is a zip manipulation library written in C.
  description: |
    minizip-ng is a zip manipulation library written in C
  dev_url: https://github.com/zlib-ng/minizip-ng

extra:
  recipe-maintainers:
    - akrherz
